<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500" role="img" aria-labelledby="title desc">
  <title id="title">Photo Framer: four steps / Bốn bước</title>
  <desc id="desc">Install the skill, attach photos, choose a style from A to G, then save the framed PNG. Cài skill, đính kèm ảnh, chọn phong cách A đến G, rồi tải PNG có khung.</desc>
  <rect width="420" height="500" rx="16" fill="#faf7f0"/>
  <path d="M54 67v360" stroke="#d7d1c8" stroke-width="2"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g fill="#112447" font-size="22" font-weight="600" text-anchor="middle">
      <circle cx="54" cy="67" r="22" fill="#f66b58"/>
      <text x="54" y="75">1</text>
      <circle cx="54" cy="187" r="22" fill="#f66b58"/>
      <text x="54" y="195">2</text>
      <circle cx="54" cy="307" r="22" fill="#f66b58"/>
      <text x="54" y="315">3</text>
      <circle cx="54" cy="427" r="22" fill="#f66b58"/>
      <text x="54" y="435">4</text>
    </g>
    <g fill="#112447" font-size="28" font-weight="600">
      <text x="100" y="61">Install the skill</text>
      <text x="100" y="181">Attach photos</text>
      <text x="100" y="301">Choose A–G</text>
      <text x="100" y="421">Save your PNG</text>
    </g>
    <g fill="#526073" font-size="23">
      <text x="100" y="97">Cài skill</text>
      <text x="100" y="217">Đính kèm ảnh</text>
      <text x="100" y="337">Chọn phong cách</text>
      <text x="100" y="457">Tải ảnh có khung</text>
    </g>
  </g>
</svg>
