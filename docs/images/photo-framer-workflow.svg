<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="218" viewBox="0 0 1200 218" role="img" aria-labelledby="title desc">
  <title id="title">Photo Framer: four steps / Bốn bước</title>
  <desc id="desc">Install the skill, attach photos, choose a style from A to G, then save the framed PNG. Cài skill, đính kèm ảnh, chọn phong cách A đến G, rồi tải PNG có khung.</desc>
  <rect width="1200" height="218" rx="16" fill="#faf7f0"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g fill="#112447" font-size="23" font-weight="600" text-anchor="middle">
      <circle cx="60" cy="49" r="22" fill="#f66b58"/>
      <text x="60" y="57">1</text>
      <circle cx="360" cy="49" r="22" fill="#f66b58"/>
      <text x="360" y="57">2</text>
      <circle cx="660" cy="49" r="22" fill="#f66b58"/>
      <text x="660" y="57">3</text>
      <circle cx="960" cy="49" r="22" fill="#f66b58"/>
      <text x="960" y="57">4</text>
    </g>
    <g fill="#112447" font-size="30" font-weight="600">
      <text x="38" y="116">Install the skill</text>
      <text x="338" y="116">Attach photos</text>
      <text x="638" y="116">Choose A–G</text>
      <text x="938" y="116">Save your PNG</text>
    </g>
    <g fill="#526073" font-size="24">
      <text x="38" y="158">Cài skill</text>
      <text x="338" y="158">Đính kèm ảnh</text>
      <text x="638" y="158">Chọn phong cách</text>
      <text x="938" y="158">Tải ảnh có khung</text>
    </g>
  </g>
  <g fill="none" stroke="#9c9b97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M255 49h43m-8-8 8 8-8 8"/>
    <path d="M555 49h43m-8-8 8 8-8 8"/>
    <path d="M855 49h43m-8-8 8 8-8 8"/>
  </g>
</svg>
