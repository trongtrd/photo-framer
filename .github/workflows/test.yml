name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            pillow: 'Pillow==10.1.0'
          - os: ubuntu-latest
            python: '3.12'
            pillow: 'Pillow>=12,<13'
          - os: windows-latest
            python: '3.12'
            pillow: 'Pillow>=12,<13'
          - os: macos-latest
            python: '3.12'
            pillow: 'Pillow>=12,<13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r skills/photo-framer/scripts/requirements.txt "${{ matrix.pillow }}"
      - run: python skills/photo-framer/scripts/test_frame_photo.py
